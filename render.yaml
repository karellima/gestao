services:
  - type: web
    name: gestao
    env: python
    plan: free
    buildCommand: cd frontend && npm install && npm run build && cd ../backend && pip install -r requirements.txt
    # As migrations rodam aqui, e não no buildCommand: o build não alcança o
    # banco e roda por artefato, não por release.
    startCommand: cd backend && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gestao-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 480
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FORMAT
        value: json
      - key: CORS_ORIGINS
        value: https://gestao-iscb.onrender.com

databases:
  - name: gestao-db
    databaseName: gestao
    plan: free
