services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ${IONOS_ENV_FILE:-.env.ionos}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 6

  app:
    image: ${APP_IMAGE:?APP_IMAGE must be set in .env.ionos}
    restart: unless-stopped
    env_file:
      - ${IONOS_ENV_FILE:-.env.ionos}
    environment:
      PORT: 8000
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  postgres_data:
