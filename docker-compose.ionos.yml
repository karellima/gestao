services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ${IONOS_ENV_FILE:-.env.ionos}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 6

  app:
    image: ${APP_IMAGE:?APP_IMAGE must be set in .env.ionos}
    restart: unless-stopped
    env_file:
      - ${IONOS_ENV_FILE:-.env.ionos}
    environment:
      PORT: 8000
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    networks:
      default:
      proxy:
        aliases:
          - gestao-app
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  # Túnel de saída para a Cloudflare. Enquanto ele existir, o Gestão não depende
  # de porta de entrada nenhuma: quem abre a conexão é este container, para
  # fora. Não há IP de origem para descobrir nem porta para varrer, e o
  # `CF-Connecting-IP` que o rate limit do login usa passa a ser confiável,
  # porque só o cloudflared alcança o app.
  #
  # Mesmo desenho do túnel que já roda para o `logps` neste servidor
  # (`/home/karel/pazesousa/ops/production/compose.yaml`): imagem pinada por
  # digest, token em Docker secret lido de arquivo — nunca em variável de
  # ambiente, que vaza em `docker inspect` e em log de processo.
  #
  # O serviço é opcional por profile: sem `--profile tunnel` nada muda, e o
  # Caddy segue atendendo. É isso que permite provar o túnel no ar antes de
  # tirar o bloco do proxy.
  cloudflared:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:2026.7.0@sha256:5e49861633763e8933475477c20bae6039ed47f32c1d267a34babc347f28f0df
    restart: unless-stopped
    command:
      - tunnel
      - --no-autoupdate
      - --metrics
      - 0.0.0.0:2000
      - run
      - --token-file
      - /run/secrets/cloudflare_tunnel_token
    secrets:
      - cloudflare_tunnel_token
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:2000", "ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      # O watchtower roda neste servidor e atualiza container sozinho. Um túnel
      # que se atualiza sem ninguém pedir é deploy não autorizado do caminho de
      # entrada do sistema — a imagem está pinada por digest justamente para
      # isso, e o rótulo garante que ninguém a troque por baixo.
      com.centurylinklabs.watchtower.enable: "false"
    mem_limit: 128m
    cpus: "0.25"
    read_only: true

volumes:
  postgres_data:

networks:
  proxy:
    name: gestao_proxy

secrets:
  cloudflare_tunnel_token:
    # Arquivo com o token do túnel, criado no servidor e nunca versionado.
    # `/opt/gestao` pertence ao usuário da aplicação, então não precisa de sudo.
    file: "${GESTAO_SECRETS_DIR:-/opt/gestao/secrets}/cloudflare_tunnel_token"
