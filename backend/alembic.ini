[alembic]
script_location = alembic
prepend_sys_path = .

# Só um fallback: quem manda é o DATABASE_URL, lido em alembic/env.py.
# Deixar um valor aqui evita que o alembic recuse a subir sem configuração.
sqlalchemy.url = postgresql://postgres:postgres@localhost:5432/gestao_app

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
