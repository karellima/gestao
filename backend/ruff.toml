# Config do coletor de lint do quality gate (../quality/gate.py).
# O conjunto de regras é explícito de propósito: se dependesse do default do
# ruff, uma atualização da ferramenta mudaria o baseline sem ninguém mexer no
# código. A versão do ruff também está pinada em requirements-dev.txt.
target-version = "py312"
line-length = 120

exclude = [".venv", "alembic/versions"]

[lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "DTZ", "S", "BLE", "FLY", "PLW", "RUF"]

[lint.per-file-ignores]
# Testes podem usar assert e credenciais de mentira.
"tests/**" = ["S101", "S105", "S106"]
